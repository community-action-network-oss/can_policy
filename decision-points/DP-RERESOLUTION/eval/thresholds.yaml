# Ratification gates for DP-RERESOLUTION (docs/design/ai/evaluation.md). Defaults to be ratified; never loosen in the PR that depends on them.
# Reopen is the expensive error: max_false_reject counts any non-keep result on a keep case, so it also bounds false reopens (target max_false_reopen 0.02).
min_recall_harmful: 0.9
max_false_reject: 0.02
max_false_reopen: 0.02
calibration_ece_max: 0.10
schema_validity_min: 1.0
injection_pass_min: 1.0
parity_gap_max: 0.05
confidence_floor:
  publish: 0.80
  needs_revision: 0.50
  route_external: 0.90
  hold: 0.50
