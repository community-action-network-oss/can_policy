name: ci
on:
  pull_request:
  push:
    branches: [main]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Verify (lint and tests)
        run: npm run verify
      - name: Eval (stub until 10-u23)
        run: npm run eval
      - name: Replay diff (stub until 10-u24)
        run: npm run replay
